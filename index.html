<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ray Wallet</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    color: #17202a;
    min-height: 100vh;
}

/* LOGIN */

.login-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.10);
}

.logo {
    width: 65px;
    height: 65px;
    background: #111827;
    color: white;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
}

.login-box h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    color: #718096;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin: 18px 0 8px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d5dbe3;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #111827;
}

.login-button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    opacity: 0.9;
}

#message {
    text-align: center;
    margin-top: 15px;
    min-height: 20px;
}

.error {
    color: #d62828;
}

.success {
    color: #16803c;
}

.demo {
    margin-top: 25px;
    padding: 15px;
    border-radius: 10px;
    background: #f4f6f8;
    font-size: 14px;
    line-height: 1.6;
    color: #555;
}

/* DASHBOARD */

#dashboard {
    display: none;
}

.dashboard {
    width: min(900px, 94%);
    margin: auto;
    padding: 25px 0;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.welcome {
    color: #718096;
    font-size: 14px;
}

.topbar h2 {
    margin-top: 5px;
}

.logout {
    border: none;
    background: #e9edf2;
    padding: 10px 18px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.balance {
    background: #111827;
    color: white;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 25px;
}

.balance p {
    opacity: .7;
}

.balance h1 {
    font-size: 38px;
    margin: 12px 0;
}

.balance span {
    opacity: .65;
}

.actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.action {
    background: white;
    border: none;
    border-radius: 15px;
    padding: 20px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.action:hover {
    transform: translateY(-2px);
}

.action-icon {
    font-size: 25px;
    margin-bottom: 10px;
}

.action strong,
.action small {
    display: block;
}

.action small {
    margin-top: 5px;
    color: #718096;
}

.transactions {
    background: white;
    border-radius: 18px;
    padding: 25px;
}

.transactions h2 {
    margin-bottom: 10px;
}

.transaction {
    display: flex;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px solid #edf0f3;
}

.transaction small {
    display: block;
    color: #718096;
    margin-top: 5px;
}

.credit {
    color: #16803c;
}

.debit {
    color: #d62828;
}

.footer {
    text-align: center;
    color: #87909c;
    margin-top: 30px;
    font-size: 13px;
}

/* MOBILE */

@media (max-width: 650px) {

    .login-box {
        padding: 25px;
    }

    .actions {
        grid-template-columns: repeat(2, 1fr);
    }

    .balance h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <div class="logo">R</div>

        <h1>Ray Wallet</h1>

        <p class="subtitle">
            Secure personal wallet
        </p>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

            <p id="message"></p>

        </form>

        <div class="demo">
            <strong>Demo login</strong><br>
            Username: raymond<br>
            Password: 1234
        </div>

    </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

    <div class="dashboard">

        <div class="topbar">

            <div>
                <div class="welcome">
                    Welcome back
                </div>

                <h2 id="displayName">
                    Raymond
                </h2>
            </div>

            <button
                class="logout"
                id="logoutButton"
            >
                Logout
            </button>

        </div>


        <div class="balance">

            <p>Demo Balance</p>

            <h1>
                ₦250,000.00
            </h1>

            <span>
                Personal wallet
            </span>

        </div>


        <div class="actions">

            <button class="action" onclick="demoAction('Fund')">

                <div class="action-icon">
                    ＋
                </div>

                <strong>
                    Fund
                </strong>

                <small>
                    Add demo funds
                </small>

            </button>


            <button class="action" onclick="demoAction('Send')">

                <div class="action-icon">
                    ↗
                </div>

                <strong>
                    Send
                </strong>

                <small>
                    Demo transfer
                </small>

            </button>


            <button class="action" onclick="demoAction('Withdraw')">

                <div class="action-icon">
                    ↙
                </div>

                <strong>
                    Withdraw
                </strong>

                <small>
                    Demo withdrawal
                </small>

            </button>


            <button class="action" onclick="demoAction('History')">

                <div class="action-icon">
                    ▣
                </div>

                <strong>
                    History
                </strong>

                <small>
                    Transactions
                </small>

            </button>

        </div>


        <div class="transactions">

            <h2>
                Recent activity
            </h2>


            <div class="transaction">

                <div>
                    <strong>
                        Demo deposit
                    </strong>

                    <small>
                        Today
                    </small>
                </div>

                <strong class="credit">
                    +₦50,000
                </strong>

            </div>


            <div class="transaction">

                <div>
                    <strong>
                        Demo transfer
                    </strong>

                    <small>
                        Yesterday
                    </small>
                </div>

                <strong class="debit">
                    -₦10,000
                </strong>

            </div>


            <div class="transaction">

                <div>
                    <strong>
                        Demo deposit
                    </strong>

                    <small>
                        Monday
                    </small>
                </div>

                <strong class="credit">
                    +₦25,000
                </strong>

            </div>

        </div>


        <div class="footer">
            Ray Wallet — Demo Project
        </div>

    </div>

</div>


<script>

/* LOGIN */

const loginForm =
    document.getElementById("loginForm");

const loginPage =
    document.getElementById("loginPage");

const dashboard =
    document.getElementById("dashboard");

const message =
    document.getElementById("message");

const loginButton =
    document.getElementById("loginButton");

const displayName =
    document.getElementById("displayName");


/* Check if already logged in */

if (
    localStorage.getItem("rayWalletLoggedIn")
    === "true"
) {

    showDashboard();

}


/* Login */

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username")
            .value
            .trim();

        const password =
            document.getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        setTimeout(function() {

            /*
             * DEMO CREDENTIALS
             */

            if (
                username === "raymond" &&
                password === "1234"
            ) {

                localStorage.setItem(
                    "rayWalletLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "rayWalletUsername",
                    username
                );


                message.textContent =
                    "Login successful.";

                message.className =
                    "success";


                setTimeout(function() {

                    showDashboard();

                }, 500);


            } else {

                message.textContent =
                    "Incorrect username or password.";

                message.className =
                    "error";

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }

        }, 500);

    }
);


/* Show dashboard */

function showDashboard() {

    loginPage.style.display =
        "none";

    dashboard.style.display =
        "block";


    const savedUsername =
        localStorage.getItem(
            "rayWalletUsername"
        );


    if (savedUsername) {

        displayName.textContent =
            savedUsername;

    }

}


/* Logout */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        function() {

            localStorage.removeItem(
                "rayWalletLoggedIn"
            );

            localStorage.removeItem(
                "rayWalletUsername"
            );


            dashboard.style.display =
                "none";

            loginPage.style.display =
                "flex";


            document
                .getElementById("username")
                .value = "";

            document
                .getElementById("password")
                .value = "";

            message.textContent = "";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }
    );


/* Demo buttons */

function demoAction(action) {

    alert(
        action +
        " is available in demo mode."
    );

}

</script>

</body>
</html>
