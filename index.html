<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ray Gadgets | Smart Technology. Better Living.</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#05080f;
    color:#fff;
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* ================= NAVBAR ================= */

nav{
    position:sticky;
    top:0;
    z-index:9999;
    height:75px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(5,8,15,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #1b2635;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:#00e5ff;
}

.nav-links{
    display:flex;
    gap:28px;
    list-style:none;
}

.nav-links a{
    color:#c8d0db;
    font-size:14px;
    font-weight:bold;
    transition:.3s;
}

.nav-links a:hover{
    color:#00e5ff;
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.shop-btn,
.cart-btn{
    border:0;
    border-radius:25px;
    padding:11px 18px;
    font-weight:bold;
}

.shop-btn{
    background:#00e5ff;
    color:#001014;
}

.cart-btn{
    background:#111a27;
    color:white;
    border:1px solid #293548;
}

.cart-count{
    background:#ff3d71;
    padding:2px 6px;
    border-radius:20px;
    font-size:11px;
}

/* ================= HERO ================= */

.hero{
    min-height:680px;
    padding:80px 7%;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:40px;

    background:
    radial-gradient(circle at 75% 45%,rgba(0,229,255,.2),transparent 30%),
    radial-gradient(circle at 15% 80%,rgba(111,56,255,.16),transparent 30%);
}

.hero-text{
    max-width:650px;
}

.hero-small{
    color:#00e5ff;
    font-size:13px;
    font-weight:bold;
    letter-spacing:4px;
}

.hero h1{
    font-size:clamp(48px,7vw,82px);
    line-height:.96;
    margin:20px 0;
    letter-spacing:-4px;
}

.hero h1 span{
    color:#00e5ff;
}

.hero p{
    color:#aab5c5;
    line-height:1.7;
    font-size:17px;
    max-width:560px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.primary{
    background:#00e5ff;
    color:#001014;
    border:0;
    padding:15px 25px;
    border-radius:30px;
    font-weight:bold;
}

.outline{
    border:1px solid #344256;
    background:transparent;
    color:white;
    padding:15px 25px;
    border-radius:30px;
    font-weight:bold;
}

.hero-showcase{
    min-height:430px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.glow{
    position:absolute;
    width:330px;
    height:330px;
    border-radius:50%;
    border:2px solid #00e5ff;
    box-shadow:
    0 0 30px #00e5ff,
    inset 0 0 30px #00e5ff;
    opacity:.5;
}

.gadget-stack{
    position:relative;
    width:390px;
    height:330px;
}

.phone{
    position:absolute;
    width:135px;
    height:240px;
    background:linear-gradient(145deg,#25364c,#080d15);
    border:5px solid #202c3d;
    border-radius:25px;
    left:35px;
    top:45px;
    transform:rotate(-12deg);
    box-shadow:0 20px 50px #000;
}

.phone:before{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:18px;
    background:
    radial-gradient(circle at 70% 30%,#00e5ff,transparent 5%),
    linear-gradient(135deg,#071421,#123a57);
}

.laptop{

    width:270px;
    height:175px;
    border-radius:12px;

    right:5px;
    top:45px;
    transform:rotate(-5deg);
    box-shadow:0 20px 50px #000;
    border:4px solid #27384b;
}
